<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="80"/>
    </clipPath>
  </defs>
  <!-- slate base -->
  <rect width="512" height="512" rx="80" fill="#0F1C2E"/>
  <!-- copper left half -->
  <rect width="256" height="512" clip-path="url(#tile)" fill="#B87333"/>
  <!-- subtle divider -->
  <rect x="254" y="60" width="2" height="392" fill="#0F1C2E" opacity="0.28"/>
  <!-- E — centered in copper half (x=128) -->
  <text x="134" y="388"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="340" font-weight="700"
    fill="#0F1C2E" opacity="0.90">E</text>
  <!-- T — centered in slate half (x=384) -->
  <text x="378" y="388"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="340" font-weight="700"
    fill="#F5F0E8" opacity="0.96">T</text>
</svg>
