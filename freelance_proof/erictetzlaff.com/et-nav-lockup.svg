<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 44" width="160" height="44">
  <defs>
    <clipPath id="tile">
      <rect width="44" height="44" rx="5"/>
    </clipPath>
  </defs>
  <!-- square tile mark -->
  <rect width="44" height="44" rx="5" fill="#0F1C2E"/>
  <rect width="22" height="44" clip-path="url(#tile)" fill="#B87333"/>
  <text x="11" y="33"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, serif"
    font-size="28" font-weight="700"
    fill="#0F1C2E" opacity="0.90">E</text>
  <text x="33" y="33"
    text-anchor="middle"
    font-family="'Playfair Display', Georgia, serif"
    font-size="28" font-weight="700"
    fill="#F5F0E8">T</text>
  <!-- name text beside mark -->
  <text x="54" y="18"
    font-family="'DM Mono', monospace, sans-serif"
    font-size="11" font-weight="500"
    fill="#B87333" letter-spacing="0.14em">ERIC</text>
  <text x="54" y="34"
    font-family="'DM Mono', monospace, sans-serif"
    font-size="11" font-weight="400"
    fill="#5A6A7A" letter-spacing="0.1em">TETZLAFF</text>
</svg>
